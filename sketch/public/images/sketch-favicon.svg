<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sketch">
  <title>Sketch</title>
  <!-- Favicon variant of the Sketch mark. The tile radius and the
       margins are smaller, and every panel is solid. The mark
       stays legible at 16 px.
       Tile colour is the frappe-ui token surface-gray-9,
       oklch(20.5% 0 0), as its sRGB hex.
       Tile radius 12 is the token radius rounded-6.
       Panel radius 4 is the token radius rounded-1. -->
  <rect width="64" height="64" rx="12" fill="#262626"/>
  <rect x="12" y="12" width="40" height="9" rx="4" fill="#FFFFFF"/>
  <rect x="12" y="26" width="17" height="26" rx="4" fill="#FFFFFF"/>
  <rect x="35" y="26" width="17" height="26" rx="4" fill="#FFFFFF"/>
</svg>
