<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype</title>

    <!-- Every URL here must be absolute. build.sh rewrites RUNTIME to the
         Pin's asset path. The renderer serves this document from
         /u/<username>/<slug>, so a relative URL asks the wrong directory. -->

    <!-- Layer 1: precompiled frappe-ui CSS. Components are styled at first paint. -->
    <link rel="stylesheet" href="RUNTIME/frappe-ui.css" />
    <link rel="stylesheet" href="RUNTIME/frappe-ui-components.css" />

    <script type="importmap">
      {
        "imports": {
          "vue": "RUNTIME/vue.js",
          "vue-router": "RUNTIME/vue-router.js",
          "frappe-ui": "RUNTIME/frappe-ui.js",
          "frappe-ui/list": "RUNTIME/frappe-ui-list.js",
          "frappe-ui/editor": "RUNTIME/frappe-ui-editor.js",
          "frappe-ui/charts": "RUNTIME/frappe-ui-charts.js",
          "frappe-ui/icons": "RUNTIME/frappe-ui-icons.js",
          "dayjs": "RUNTIME/dayjs.js",
          "@vueuse/core": "RUNTIME/vueuse.js",
          "sketch:compiler": "RUNTIME/compiler.js",
          "sketch:tailwind": "RUNTIME/tailwind.js"
        }
      }
    </script>

    <!-- Sketch's own chrome: the status screen boot.js paints when a
         Prototype is empty or does not build. It cannot use a frappe-ui
         component, because those need Vue and the screen mounts none, and it
         must not import the Sketch SPA.

         Layer 1 above is compiled from frappe-ui's own source, so it carries
         every token utility a frappe-ui component uses (`text-p-sm`,
         `text-ink-gray-5`, the 301 `lucide-*` classes) but not every layout
         utility Tailwind can emit: `py-16` and `size-12` are both absent.
         Type and ink therefore stay as token classes on the markup, and the
         layout lives here. Colour and radius read the custom properties layer
         1 declares on :root, so this block flips with data-theme like the rest
         of the page and holds no literal colour of its own.

         Length is the one thing that cannot follow a token here. The sibling
         template `sketch/templates/sketch_page.html` writes every length as
         `calc(var(--spacing) * N)`, because the portal loads
         `website.bundle.css` and that bundle declares `--spacing`. Neither
         `frappe-ui.css` nor `frappe-ui-components.css` declares it, and this
         document loads nothing else, so the same `calc` would resolve to
         nothing on the status screen. Lengths stay in rem on the same 0.25rem
         step Tailwind uses. -->
    <style>
      .sk-status {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
      }
      .sk-status-box {
        display: flex;
        width: 100%;
        max-width: 28rem;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }
      .sk-status-glyph {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 3rem;
        height: 3rem;
        border-radius: var(--radius-full);
        background-color: var(--surface-gray-2);
        color: var(--ink-gray-5);
      }
      /* The one accent on the screen, and only on the failing statuses. */
      .sk-status-glyph-alert {
        background-color: var(--surface-red-2);
        color: var(--ink-red-7);
      }
      .sk-status-body {
        max-width: 24rem;
      }
      .sk-status-list {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 0.5rem;
        text-align: left;
      }
      /* A compile message carries a whole tag, path or specifier and no spaces,
         so it breaks mid-word instead of pushing the card sideways. */
      .sk-error {
        border-radius: var(--radius-4);
        background-color: var(--surface-gray-1);
        padding: 0.75rem;
        overflow-wrap: anywhere;
      }
      .sk-error > p + p {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <!--
    `text-ink-gray-8` is the page default and it is set once, here, the way
    App.vue sets it once for the Sketch UI. TOKENS.md > Hierarchy keeps gray-9
    for the strongest values on a screen, unread row titles and KPI figures.
    Neither the Viewer chrome nor a Prototype draws one, so gray-9 as the page
    default left nothing above the body copy.
  -->
  <body class="h-full bg-surface-base text-ink-gray-8">
    <div id="app" class="h-full"></div>
    <!-- build.sh stamps the empty data slot here. The renderer fills it
         with the Prototype's tree, once, per request. The placeholder must
         not appear anywhere above this line: the renderer replaces the
         first occurrence and nothing else. -->
    SKETCH_DATA_SLOT
    <!-- The query is boot.js's own content hash, stamped by build.sh. The
         asset is served with `max-age=43200`, and Cloudflare caches it at the
         edge, so a changed boot.js used to reach a warm client up to twelve
         hours late. A hard reload does not help: it revalidates against the
         edge, which answers from its own copy. A new hash is a new URL, which
         no cache can match. This document is safe to key on, because the
         renderer serves it with `no-store` on every request. -->
    <script type="module" src="RUNTIME/boot.js?v=BOOT_VERSION"></script>
  </body>
</html>
